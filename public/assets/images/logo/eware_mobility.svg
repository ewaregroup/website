<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .cls-car { fill: none; stroke: #02723c; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .cls-bolt { fill: #f38c2d; }
      .cls-sign { fill: #02723c; }
      .cls-text-eware { font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; font-style: italic; fill: #111; font-size: 64px; letter-spacing: 2px; }
      .cls-text-sub { font-family: 'Montserrat', 'Arial', sans-serif; font-weight: 800; fill: #2c2560; font-size: 34px; letter-spacing: 6px; }
    </style>
  </defs>
  <!-- Car Body Outline -->
  <path class="cls-car" d="M 100 240 C 95 210, 115 150, 190 125 C 260 102, 340 105, 395 125 C 425 138, 445 180, 445 220 C 445 240, 435 245, 420 245 C 405 245, 400 230, 395 215 C 385 185, 360 170, 320 168 C 240 165, 170 175, 140 215 C 132 225, 125 240, 100 240 Z" />
  
  <!-- Left Wheel (-) -->
  <circle cx="145" cy="245" r="42" fill="none" stroke="#02723c" stroke-width="14" />
  <rect x="125" y="240" width="40" height="10" rx="5" class="cls-sign" />
  
  <!-- Right Wheel (+) -->
  <circle cx="370" cy="245" r="42" fill="none" stroke="#02723c" stroke-width="14" />
  <rect x="350" y="240" width="40" height="10" rx="5" class="cls-sign" />
  <rect x="365" y="225" width="10" height="40" rx="5" class="cls-sign" />
  
  <!-- Lightning Bolt -->
  <polygon class="cls-bolt" points="268,135 235,210 262,210 244,275 292,192 265,192" />
  
  <!-- Brand Text -->
  <!-- EWARE -->
  <text x="256" y="365" text-anchor="middle" class="cls-text-eware">EWARE</text>
  <!-- E-MOBILITY -->
  <text x="256" y="420" text-anchor="middle" class="cls-text-sub">E-MOBILITY</text>
</svg>
